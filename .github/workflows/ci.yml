# ============================================
# NEXUS Music Manager - CI/CD Pipeline
# ============================================
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0
        sudo apt-get install -y xvfb

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-qt pytest-cov pytest-asyncio

    - name: Run tests
      run: |
        xvfb-run -a pytest tests/ -v --cov=src --cov-report=xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pip-audit bandit safety

    - name: Run pip-audit
      run: pip-audit --progress-spinner off
      continue-on-error: true

    - name: Run bandit
      run: bandit -r src/ -f txt -ll
      continue-on-error: true

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linters
      run: pip install black flake8 isort

    - name: Check formatting with black
      run: black --check src/ tests/ --line-length 120
      continue-on-error: true

    - name: Run flake8
      run: flake8 src/ --max-line-length=120 --ignore=E501,W503
      continue-on-error: true

  build:
    name: Build Test
    runs-on: windows-latest
    needs: [test]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller --name "NEXUS_Music" --windowed --onefile src/main.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: NEXUS_Music_Windows
        path: dist/NEXUS_Music.exe
